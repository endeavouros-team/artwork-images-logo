<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 382" width="1200" height="382" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Your browser opened itself? That wasn’t a bug. It’s homework.</title>
  <desc id="d">A fake sway desktop: Firefox, a terminal and an editor tiled next to each other, joking that the forced README is homework.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120d1f"/>
      <stop offset="1" stop-color="#1d1033"/>
    </linearGradient>
    <linearGradient id="focus" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d6409f"/>
      <stop offset="1" stop-color="#7f3fbf"/>
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: 'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .mono { font-family: 'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace; }
    .big  { font-size: 42px; font-weight: 800; letter-spacing: -0.5px; }
    .term { font-size: 15px; }
    .dim  { fill: #8b7fa8; }
    .txt  { fill: #ece6f7; }
  </style>

  <rect width="1200" height="382" fill="url(#bg)"/>

  <g transform="translate(0,-34)">
  <!-- left tile: firefox (focused) -->
  <rect x="12" y="46" width="700" height="358" rx="6" fill="#171026" stroke="url(#focus)" stroke-width="3"/>
  <rect x="14" y="48" width="696" height="28" rx="4" fill="#2a1b45"/>
  <text x="28" y="67" class="sans txt" font-size="13" font-weight="600">Firefox — force-knowledge.md</text>
  <!-- address bar -->
  <rect x="28" y="88" width="668" height="26" rx="13" fill="#0e0918"/>
  <text x="44" y="106" class="mono dim" font-size="12">github.com/endeavouros-team/endeavouros-sway-setup/…/force-knowledge.md</text>

  <text x="40" y="186" class="sans big txt">Your browser opened itself?</text>
  <text x="40" y="236" class="sans big" fill="#e56bb3">That wasn’t a bug.</text>
  <text x="40" y="286" class="sans big txt">It’s homework.</text>
  <text x="40" y="332" class="sans txt" font-size="17">You picked a tiling window manager. Sway would like a word with you.</text>
  <text x="40" y="360" class="sans dim" font-size="14">Closing this tab won’t help. It’s back at the next login.</text>
  <text x="40" y="380" class="sans dim" font-size="14">Scroll down to find out how to make it stop.</text>

  <!-- right top: terminal -->
  <rect x="722" y="46" width="466" height="170" rx="6" fill="#171026" stroke="#4a2f78" stroke-width="2"/>
  <rect x="724" y="48" width="462" height="28" rx="4" fill="#241838"/>
  <text x="738" y="67" class="sans dim" font-size="13" font-weight="600">foot — ~</text>
  <text x="738" y="106" class="mono term" fill="#7ee0a8">~ $ <tspan class="txt">sway --make-it-pretty</tspan></text>
  <text x="738" y="130" class="mono term" fill="#f2b84b">sway: unknown option. Try reading.</text>
  <text x="738" y="158" class="mono term" fill="#7ee0a8">~ $ <tspan class="txt">man sway</tspan></text>
  <text x="738" y="182" class="mono term" fill="#7ee0a8">~ $ <tspan class="txt">nano ~/.config/sway/config.d/autostart</tspan></text>
  <text x="738" y="206" class="mono term" fill="#7ee0a8">~ $</text>
  <rect x="780" y="193" width="9" height="16" fill="#ece6f7"/>

  <!-- right bottom: editor -->
  <rect x="722" y="226" width="466" height="178" rx="6" fill="#171026" stroke="#4a2f78" stroke-width="2"/>
  <rect x="724" y="228" width="462" height="28" rx="4" fill="#241838"/>
  <text x="738" y="247" class="sans dim" font-size="13" font-weight="600">nano — ~/.config/sway/config.d/autostart</text>
  <text x="738" y="286" class="mono term dim"># comment with # to stop autostarting</text>
  <text x="738" y="312" class="mono term" fill="#e56bb3">exec xdg-open https://…/force-knowledge.md</text>
  <text x="738" y="338" class="mono term dim"># ^ Comment me out and I’ll go away.</text>
  <text x="738" y="362" class="mono term dim"># Or stay. We have tiling.</text>
  <text x="738" y="388" class="mono term" fill="#f2b84b">[ Read 67 lines ]</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata>  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
